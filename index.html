<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PokéSleep Guide</title>
<meta name="pokesleep-data-schema" content="1">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#24313b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;background:#f8fafb;padding-bottom:82px}
header{padding:22px 18px 14px;background:white;position:sticky;top:0;z-index:5;border-bottom:1px solid #e5ebef}
h1{font-size:22px;margin:0}.sub{color:#7a8790;font-size:12px;margin-top:4px}
main{padding:14px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 2px 10px #0000000a}
.event{background:#e9f5ff}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-weight:700;font-size:16px}.muted{color:#7b8790;font-size:13px}
.progress{height:9px;background:#e7edf1;border-radius:99px;overflow:hidden;margin:10px 0 6px}.bar{height:100%;width:49%;background:#6b9fd0;border-radius:99px}
.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f0f6;color:#31536c;font-weight:700}
.article{padding:13px 0;border-top:1px solid #edf0f2}.article:first-child{border-top:0}
.search{width:100%;padding:12px 14px;border:1px solid #dfe6ea;border-radius:13px;font-size:15px;margin:8px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sleep{padding:14px;border-radius:15px;background:#f4f7f9}.emoji{font-size:30px}.stars{color:#d39b2d;letter-spacing:2px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:70px;background:#fff;border-top:1px solid #e3e8eb;display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:10}
nav button{background:none;border:0;color:#7a8790;font-size:11px;min-width:65px}nav button.active{color:#3e6e92;font-weight:700}nav span{display:block;font-size:22px;margin-bottom:2px}
.section{display:none}.section.active{display:block}
.badge{font-size:11px;background:#dff0df;color:#3d7446;padding:4px 8px;border-radius:99px}

select.search{background:#fff}
.eval-score{font-size:30px;font-weight:800;color:#3e6e92}
.small-note{font-size:11px;color:#89949b;margin-top:7px}

.recipe{padding:13px 0;border-top:1px solid #edf0f2}
.recipe:first-child{border-top:0}
.poke-img{width:92px;height:92px;object-fit:contain;display:block;margin:0 auto 6px}.sleep-face-img{width:100%;height:86px;object-fit:contain;display:block;margin-bottom:5px}.sleep-face{min-width:88px}
.poke-detail-img{width:120px;height:120px;object-fit:contain;display:block}.pokemon-page-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.back-btn{background:#eef3f7;border:0;border-radius:12px;padding:9px 12px;font-weight:700;color:#31536c}.pokemon-page-title{font-size:20px;font-weight:800}.pokemon-hero{background:#f4f7f9;border-radius:18px;padding:16px;text-align:center}.pokemon-hero img{width:180px;height:180px;object-fit:contain}.recipe-title{font-weight:700}
.recipe-tags{font-size:12px;color:#71808a;margin-top:4px}
.sleep-profile{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.profile-box{background:#f7f9fa;border-radius:12px;padding:11px}.profile-box .label{font-size:11px;color:#7b8790}.profile-box .value{font-weight:800;margin-top:3px}.ingredient-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.ingredient-pill{background:#fff3d8;border-radius:999px;padding:5px 8px;font-size:12px}.evo-title{font-weight:800;margin-bottom:8px}.evo-grid{display:grid;grid-template-columns:1fr;gap:8px}.evo-card{display:flex;align-items:center;gap:10px;background:#f7f9fa;border-radius:14px;padding:9px;border:1px solid #edf0f2}.evo-card.clickable{cursor:pointer}.evo-card img{width:62px;height:62px;object-fit:contain}.evo-card .evo-name{font-weight:800}.evo-card .evo-cond{font-size:11px;color:#7b8790;margin-top:3px}.evo-arrow{text-align:center;color:#8a969d;font-size:18px;margin:-2px 0}

.ingredient-row{display:flex;align-items:center;gap:10px;background:#fffaf0;border-radius:14px;padding:8px 10px;margin-top:7px}.ingredient-row img{width:42px;height:42px;object-fit:contain;flex:none}.ingredient-main{flex:1}.ingredient-name{font-weight:800;font-size:13px}.ingredient-qty{font-size:11px;color:#7b8790;margin-top:3px}.ingredient-level{font-size:10px;background:#fff0c8;border-radius:999px;padding:3px 7px;display:inline-block;margin-left:4px}.ingredient-note{font-size:10px;color:#8a969d;margin-top:8px}

/* Pokédex compact icon layout */
#dexGrid.dex-icon-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.dex-icon{padding:3px 1px 4px;border-radius:10px;text-align:center;cursor:pointer;min-width:0;border:1px solid rgba(0,0,0,.025)}
.dex-icon .poke-img{width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;margin:0 auto 2px;border-radius:50%;padding:2px}
.dex-icon b{display:block;font-size:7px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dex-icon .dex-no{font-size:6px;color:#71808a;line-height:1.1}
.type-grass{background:#effaf0}.type-fire{background:#fff3ef}.type-water{background:#eef7ff}.type-bug{background:#f4fae9}.type-normal{background:#f7f7f5}.type-poison{background:#f8f0fb}.type-electric{background:#fff9e8}.type-ground{background:#fbf4e8}.type-fairy{background:#fff1f7}.type-flying{background:#f1f6ff}.type-default{background:#f5f7f8}
.dex-filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}.dex-filters select{margin:0;padding:9px 7px;font-size:12px}
@media(max-width:380px){#dexGrid.dex-icon-grid{gap:3px}.dex-icon b{font-size:6px}.dex-icon .dex-no{font-size:5.5px}}
</style>

<style>
.sleep-faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sleep-face{background:#f7f8fa;border-radius:12px;padding:10px 6px;text-align:center}.face-icon{font-size:28px;margin-bottom:4px}.sleep-face b{display:block;font-size:12px}.sleep-face span{display:block;font-size:11px;color:#888;margin-top:3px}
</style>
<style>#dexGrid.dex-icon-grid{grid-template-columns:repeat(3,1fr);gap:10px}.dex-icon{padding:9px 6px;border-radius:16px}.dex-icon .poke-img{width:82px;height:82px}.dex-icon b{font-size:12px;white-space:normal}.dex-icon .dex-no{font-size:10px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:8px 0}.tab{border:0;border-radius:999px;padding:9px 12px;background:#edf2f5;font-weight:700;white-space:nowrap}.tab.active{background:#dcecf8;color:#315f80}.team5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.slot,.boxmon{background:#f4f7f9;border-radius:14px;padding:7px;text-align:center}.slot img,.boxmon img{width:100%;aspect-ratio:1;object-fit:contain}.slot b{display:block;font-size:9px;overflow:hidden}.boxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.panel{display:none}.panel.active{display:block}.placeholder{background:#fff9e8;border:1px solid #f4e6b9;border-radius:12px;padding:10px;color:#806d3c;font-size:11px;margin-top:8px}.cost{display:inline-block;border-radius:99px;background:#eef3f7;padding:5px 9px;font-weight:800}.facecheck{display:block;margin-top:8px}</style>
<style>
.recipe-tools{background:#f7f9fa;border-radius:14px;padding:10px;margin:10px 0}
.ingredient-filter{display:flex;gap:7px;overflow-x:auto;padding:4px 0 2px}
.ing-filter-btn{border:1px solid #e1e7eb;background:white;border-radius:12px;min-width:46px;height:46px;font-size:22px}
.ing-filter-btn.active{outline:2px solid #6b9fd0;background:#edf6ff}
.camp-toggle{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.switch{border:0;border-radius:999px;padding:7px 12px;font-weight:800;background:#e7edf1;color:#65737c}
.switch.on{background:#dff0df;color:#397046}
.recipe-card{border-top:1px solid #edf0f2;padding:14px 0;cursor:pointer}
.recipe-card:first-child{border-top:0}
.recipe-energy-max{font-size:18px;font-weight:900;color:#31536c;margin-top:7px}
.recipe-energy-base{font-size:12px;color:#71808a;margin-top:2px}
.recipe-ing-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
.pot-count{font-weight:900;background:#eef3f7;border-radius:999px;padding:5px 9px}
.ing-chip{display:inline-flex;align-items:center;gap:2px;background:#fff7e6;border-radius:999px;padding:5px 8px;font-weight:800}
.recipe-detail-ing{background:#fffaf0;border-radius:14px;padding:10px;margin-top:8px}
.recipe-detail-ing-title{font-weight:900}
.recipe-pokemon-row{display:flex;gap:8px;overflow-x:auto;padding-top:8px}
.recipe-pokemon{position:relative;flex:0 0 58px;text-align:center;cursor:pointer}
.recipe-pokemon img{width:54px;height:54px;object-fit:contain;background:#f5f7f8;border-radius:14px}
.unlock-badge{position:absolute;right:0;bottom:0;background:#31536c;color:#fff;border-radius:999px;font-size:9px;font-weight:900;padding:2px 5px}
</style>

</head>
<body>
<div class="app">
<header><h1>🌙 PokéSleep Guide</h1><div class="sub">寝顔集めから育成まで、毎日の攻略をサポート</div></header>

<main><section id="home" class="section active"><div class="card"><div class="row"><div><div class="title">👥 今週のチーム</div><div class="muted">ホームに5匹を表示</div></div><button class="btn" onclick="show('box',document.querySelectorAll('nav button')[1])">変更</button></div><div class="team5" id="homeTeam"></div></div><div class="card"><div class="row"><div><div class="title">📖 寝顔図鑑</div><div class="muted" id="sleepProg">0 / 36 発見</div></div><b id="sleepPct">0%</b></div><div class="progress"><div class="bar" id="sleepBar" style="width:0%"></div></div></div><div class="card"><div class="title">📷 寝顔を一括チェック</div><div class="muted">寝顔図鑑のスクリーンショットを選択</div><input id="sleepShot" type="file" accept="image/*" multiple class="search"><button class="btn" style="width:100%" onclick="alert('画像解析による自動判定は次の段階で接続します')">画像解析</button></div></section><section id="box" class="section"><div class="card"><div class="row"><div><div class="title">📦 ボックス</div><div class="muted">手持ちポケモンを登録</div></div><span class="badge" id="boxCount">0匹</span></div><button class="btn" style="width:100%;margin-top:10px" onclick="addBox()">＋ 手持ちを登録</button><div class="boxgrid" id="boxGrid" style="margin-top:10px"></div></div></section><section id="dex" class="section"><div class="card"><div class="row"><div><div class="title">📖 ポケモン図鑑</div><div class="muted">タイプ・得意で絞り込み</div></div><span class="badge" id="nationalDexCount">読み込み中</span></div><input id="dexSearch" class="search" placeholder="🔍 ポケモン名で検索" oninput="applyDexFilters()"><div class="dex-filters"><select id="typeFilter" class="search" onchange="applyDexFilters()"><option value="">全タイプ</option><option>くさ</option><option>ほのお</option><option>みず</option><option>むし</option><option>ノーマル</option><option>どく</option><option>でんき</option><option>じめん</option><option>フェアリー</option></select><select id="specialtyFilter" class="search" onchange="applyDexFilters()"><option value="">全ての得意</option><option>きのみ</option><option>食材</option><option>スキル</option></select></div><div id="dexLoading" class="muted" style="padding:10px;text-align:center">読み込み中…</div><div class="dex-icon-grid" id="dexGrid"></div></div></section><section id="pokemonDetail" class="section"><div class="card"><div class="pokemon-page-head"><button class="back-btn" onclick="backToDex()">← 図鑑に戻る</button><div class="muted">ポケモン詳細</div></div><div id="pokemonPageContent"></div></div></section><section id="info" class="section"><div class="card"><div class="title">ℹ️ 情報</div><div class="tabs"><button class="tab active" onclick="infoTab('recipe',this)">🍳 料理</button><button class="tab" onclick="infoTab('field',this)">🗺️ フィールド</button></div><div id="info-recipe" class="panel active"><div class="tabs"><button class="tab active" onclick="recipeTab('カレー・シチュー',this)">🍛 カレー・シチュー</button><button class="tab" onclick="recipeTab('サラダ',this)">🥗 サラダ</button><button class="tab" onclick="recipeTab('デザート・ドリンク',this)">🍰 デザート・ドリンク</button></div><div id="recipeInfo"></div></div><div id="info-field" class="panel"><div class="tabs" id="fieldTabs"></div><div id="fieldInfo"></div></div></div></section>
<section id="recipeDetail" class="section"><div class="card">
  <div class="pokemon-page-head"><button class="back-btn" onclick="backToRecipes()">← 料理一覧</button><div class="muted">料理詳細</div></div>
  <div id="recipeDetailContent"></div>
</div></section></main>

<nav><button class="active" onclick="show('home',this)"><span>🏠</span>ホーム</button><button onclick="show('box',this)"><span>📦</span>ボックス</button><button onclick="show('dex',this)"><span>📖</span>図鑑</button><button onclick="show('info',this)"><span>ℹ️</span>情報</button></nav>
</div>
<script>
function show(id,btn){
 document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 if(btn){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
 window.scrollTo(0,0)
}
function filterDex(){ applyDexFilters(); }
function applyDexFilters(){
 const q=(document.getElementById('dexSearch')?.value||'').trim().toLowerCase();
 const type=document.getElementById('typeFilter')?.value||'';
 const specialty=document.getElementById('specialtyFilter')?.value||'';
 document.querySelectorAll('#dexGrid .dbitem').forEach(x=>{
   const okQ=!q||x.dataset.search.toLowerCase().includes(q);
   const okT=!type||x.dataset.type===type;
   const okS=!specialty||x.dataset.specialty===specialty;
   x.style.display=(okQ&&okT&&okS)?'block':'none';
 });
}

const recipeData = [
  {name:"あぶりテールカレー", ingredients:["げきからハーブ","マメミート"], tag:"カレー"},
  {name:"とくせんリンゴカレー", ingredients:["とくせんリンゴ"], tag:"カレー"},
  {name:"おやこあいカレー", ingredients:["とくせんリンゴ","マメミート"], tag:"カレー"},
  {name:"あまいホイップクリーム", ingredients:["リラックスカカオ","モーモーミルク"], tag:"デザート・ドリンク"},
  {name:"プリンのプリンアラモード", ingredients:["リラックスカカオ","モーモーミルク","とくせんエッグ"], tag:"デザート・ドリンク"}
];

function saveTeam(){
  localStorage.setItem('pokesleep_team_saved','1');
  alert('今週のチームを保存しました');
  updateTeamAnalysis();
}
function updateTeamAnalysis(){
  if(!document.getElementById('berryCount')) return;
  const mons=[...document.querySelectorAll('.teammon')];
  const counts={きのみ:0,食材:0,スキル:0};
  mons.forEach(m=>{const r=m.dataset.role;if(counts[r]!==undefined)counts[r]++;});
  document.getElementById('berryCount').textContent=counts.きのみ;
  document.getElementById('ingredientCount').textContent=counts.食材;
  document.getElementById('skillCount').textContent=counts.スキル;

  // Prototype ingredient pool for the current sample team.
  const available = new Set(["とくせんリンゴ","マメミート","げきからハーブ","リラックスカカオ","モーモーミルク","とくせんエッグ"]);
  const possible=recipeData.filter(r=>r.ingredients.every(x=>available.has(x)));
  document.getElementById('recipeCount').textContent=possible.length+"件";
  document.getElementById('recipeList').innerHTML=possible.length
    ? possible.map(r=>`<div class="recipe"><div class="recipe-title">🍳 ${r.name}</div><div class="recipe-tags">${r.tag}　｜　${r.ingredients.join("・")}</div></div>`).join("")
    : '<div class="muted" style="padding:12px 0">現在の食材では登録済みの料理を作れません。</div>';
}
updateTeamAnalysis();
function evaluatePokemon(){
 const nature=document.getElementById('nature').value;
 const role=document.getElementById('role').value;
 const s1=document.getElementById('sub1').value;
 const s2=document.getElementById('sub2').value;
 let score=60;
 if(nature.includes('スピード')) score+=12;
 if(nature.includes('確率')) score+=10;
 if(nature.includes('きのみ')) score+=10;
 if(role==='きのみ' && s1.includes('きのみ')) score+=12;
 if(role==='食材' && (s1.includes('食材')||s2.includes('食材'))) score+=10;
 if(role==='スキル' && (s1.includes('スキル')||s2.includes('スキル'))) score+=10;
 score=Math.min(score,99);
 const r=document.getElementById('evalResult');
 r.style.display='block';
 r.innerHTML='<div class="muted">入力内容からの参考評価</div><div class="eval-score">'+score+'/100</div><b>'+role+'向けの個体としてチェック</b><div class="small-note">※この評価は攻略アプリ独自の目安です。ゲーム内の公式な「個体値」ではありません。</div>';
}

function previewShot(e){
 const f=e.target.files[0]; if(!f)return;
 const img=document.getElementById('shotPreview');
 img.src=URL.createObjectURL(f); img.style.display='block';
}
function analyzeShot(){
 const f=document.getElementById('shot').files[0];
 if(!f){alert('スクリーンショットを選択してください');return;}
 document.getElementById('scanResult').style.display='block';
}


const POKE_DATA_URL = 'https://raw.githubusercontent.com/kotofurumiya/pokemon_data/master/data/pokemon_data.json';
const POKE_IMAGE_URL = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
const SLEEP_IMAGE_URL = {1:'https://www.pokemonsleep.net/wp/wp-content/themes/sleep/diagnosis/img/result/result_bulbasaur.png',2:'https://www.pokemonsleep.net/wp/wp-content/themes/sleep/diagnosis/img/result/result_ivysaur.png',3:'https://www.pokemonsleep.net/wp/wp-content/themes/sleep/diagnosis/img/result/result_venusaur.png',4:'https://www.pokemonsleep.net/wp/wp-content/themes/sleep/diagnosis/img/result/result_charmander.png',5:'https://www.pokemonsleep.net/wp/wp-content/themes/sleep/diagnosis/img/result/result_charmeleon.png',6:'https://www.pokemonsleep.net/wp/wp-content/themes/sleep/diagnosis/img/result/result_charizard.png',7:'https://www.pokemonsleep.net/wp/wp-content/themes/sleep/diagnosis/img/result/result_squirtle.png',8:'https://www.pokemonsleep.net/wp/wp-content/themes/sleep/diagnosis/img/result/result_wartortle.png',9:'https://www.pokemonsleep.net/wp/wp-content/themes/sleep/diagnosis/img/result/result_blastoise.png'};
const SLEEP_IMG = (id) => SLEEP_IMAGE_URL[id] || POKE_IMAGE_URL(id);
function imgFallback(id){return `this.onerror=null;this.src='${POKE_IMAGE_URL(id)}'`;}

function findBasePokemon(raw,name){
  const direct=raw.find(p=>p.name===name && !p.isMegaEvolution);
  if(direct) return direct;
  const alias=SLEEP_ALIAS[name];
  if(alias) return raw.find(p=>p.name===alias && !p.isMegaEvolution && !p.form);
  return null;
}

async function loadNationalDex(){
  const grid=document.getElementById('dexGrid'), loading=document.getElementById('dexLoading');
  if(!grid) return;
  try{
    const res=await fetch(POKE_DATA_URL,{cache:'force-cache'}); if(!res.ok) throw new Error('data load failed');
    const raw=await res.json();
    const list=SLEEP_ROSTER.map(name=>({name,p:findBasePokemon(raw,name)})).filter(x=>x.p && x.p.no>=1 && x.p.no<=151 && ![29,30,31,32,33,34].includes(x.p.no)).sort((a,b)=>a.p.no-b.p.no);
    grid.innerHTML=list.map(({name,p})=>{
      const m=DEX_TEST_META[p.no]||{};
      const type=m.type||(p.types||[])[0]||'—', specialty=m.specialty||'';
      const search=[name,type,specialty,p.no].join(' '), tc=TYPE_CLASS[type]||'default';
      return `<div class="dbitem dex-icon type-${tc}" data-name="${escapeHtml(name)}" data-type="${escapeHtml(type)}" data-specialty="${escapeHtml(specialty)}" data-search="${escapeHtml(search)}" onclick="showPokemonDetail(${p.no},'${escapeHtml(name)}')"><img class="poke-img" loading="lazy" src="${SLEEP_IMG(p.no)}" onerror="${imgFallback(p.no)}" alt="${escapeHtml(name)}"><b>${escapeHtml(name)}</b><div class="dex-no">${String(p.no).padStart(3,'0')}</div></div>`;
    }).join('');
    loading.textContent=`機能テスト：Pokémon Sleep登場ポケモンを全国図鑑No.151まで表示`;
    document.getElementById('nationalDexCount').textContent=`テスト ${list.length}種`;
  }catch(e){ loading.textContent='ポケモンデータの読み込みに失敗しました。通信環境を確認してください。'; }
}

<script id="pokesleep-data-layer">

 ingredients:{},recipes:{},pokemon:{},skills:{},fields:{},
 potRules:{baseCapacity:null,campMultiplier:null,eventModifiers:[]}};

 const id=psId(name); PSDB.ingredients[id]={id,name,icon};
});

 const id=`recipe_${i+1}`;
 PSDB.recipes[id]={id,category:r.cat,name:r.name,baseEnergy:r.base??null,maxLevelEnergy:r.max??null,
  ingredients:(r.ings||[]).map(([name,qty])=>({ingredientId:psId(name),qty})),
  potSize:(r.ings||[]).reduce((s,x)=>s+(Number(x[1])||0),0),image:null};
});

function dbCurrentPotCapacity({camp=false}={}){
 let cap=PSDB.potRules.baseCapacity;if(cap==null)return null;
 if(camp&&PSDB.potRules.campMultiplier!=null)cap=Math.floor(cap*PSDB.potRules.campMultiplier);
 for(const m of PSDB.potRules.eventModifiers||[])if(m?.active&&Number.isFinite(m.multiplier))cap=Math.floor(cap*m.multiplier);
 return cap;
}
function dbRecipeCookable(r,opt={}){
 const cap=dbCurrentPotCapacity(opt);return cap==null?null:r.potSize<=cap;
}
function dbSortedRecipes({category=null,ingredientId=null,camp=false}={}){
 return Object.values(PSDB.recipes)
 .filter(r=>(!category||r.category===category)&&(!ingredientId||r.ingredients?.some(x=>x.ingredientId===ingredientId)))
 .sort((a,b)=>{const ac=dbRecipeCookable(a,{camp}),bc=dbRecipeCookable(b,{camp});
  if(ac!==null&&bc!==null&&ac!==bc)return ac?-1:1;
  return (b.maxLevelEnergy||0)-(a.maxLevelEnergy||0)});
}
window.PSDB=PSDB;
window.PSDB_API={upsertPokemon:dbUpsertPokemon,upsertIngredient:dbUpsertIngredient,upsertRecipe:dbUpsertRecipe,
 recipesForIngredient:dbRecipesForIngredient,currentPotCapacity:dbCurrentPotCapacity,
 recipeCookable:dbRecipeCookable,sortedRecipes:dbSortedRecipes};
</script>
