<script id="psg-skill-index-controller">
(()=>{'use strict';
 const catalog=window.PS_CATALOG;
 const input=document.getElementById('skillSearch'),list=document.getElementById('skillIndexList'),count=document.getElementById('skillIndexCount');
 if(!catalog||!input||!list)return;
 const effects=(skill,level)=>{
  const value=skill.levels?.[level];
  if(skill.displayNote&&value?.description)return value.description;
  if(skill.effectType==='random_ingredients'&&Number.isFinite(value?.amount))return `ランダムな食材を${value.amount}個ゲットする`;
  if(skill.effectType==='team_energy_recovery'&&Number.isFinite(value?.recovery))return `チーム全員のげんきを${value.recovery}回復する`;
  if(skill.effectType==='fixed_energy'&&Number.isFinite(value?.energy))return `カビゴンのエナジーを${value.energy.toLocaleString()}増やす`;
  if(skill.effectType==='variable_energy'&&Number.isFinite(value?.min)&&Number.isFinite(value?.max))return `カビゴンのエナジーを${value.min.toLocaleString()}～${value.max.toLocaleString()}増やす`;
  return typeof value?.description==='string'&&value.description.trim()?value.description:'効果データ未確認';
 };
 function render(){
  const query=input.value.trim().toLocaleLowerCase('ja');
  const all=Object.values(catalog.skills||{});
  const matches=all.filter(s=>[s.name,...(s.tags||[]),...(s.nativeSpecies||[]).map(p=>p.name)].some(value=>String(value).toLocaleLowerCase('ja').includes(query)));
  count.textContent=`${matches.length} / ${all.length} スキル`;
  list.replaceChildren();
  if(!matches.length){const empty=document.createElement('p');empty.className='note';empty.textContent='該当するスキルはありません。';list.append(empty);return}
  matches.forEach(skill=>{
   const species=window.PS_SPECIES_CATALOG.all(catalog).filter(p=>p.dexVisible&&p.mainSkillId===skill.id);
   const item=document.createElement('details');item.className='psg-skill-entry';
   const summary=document.createElement('summary');
   const title=document.createElement('strong');title.textContent=skill.name;
   const tags=document.createElement('span');tags.className='psg-skill-tags';tags.textContent=(skill.tags||[]).join(' · ');
   const iconSrc=window.PS_IMAGE_FILES?.skills?.[skill.id];if(iconSrc){const icon=document.createElement('img');icon.src=iconSrc;icon.alt='';icon.width=36;icon.height=36;icon.style.objectFit='contain';summary.append(icon)}
   summary.append(title,tags);item.append(summary);
   const rows=document.createElement('div');rows.className='psg-skill-levels';
   for(let level=1;level<=Math.min(10,Number(skill.maxLevel)||0);level++){
    const row=document.createElement('div');row.className='psg-skill-level';
    const label=document.createElement('b');label.textContent=`Lv.${level}`;
    const description=document.createElement('span');description.textContent=effects(skill,level);
    row.append(label,description);rows.append(row);
   }
   item.append(rows);
   if(skill.displayNote){const note=document.createElement('p');note.className='note';note.textContent=skill.displayNote;item.append(note)}
   if(skill.ruleNotes?.length){
    const conditions=document.createElement('details');conditions.className='psg-skill-conditions';
    const label=document.createElement('summary');label.textContent='発動条件・持続・出典';conditions.append(label);
    const sources=new Map();
    for(const note of skill.ruleNotes){const p=document.createElement('p'),title=document.createElement('b');title.textContent=note.label+'：';p.append(title,document.createTextNode(note.text));conditions.append(p);for(const source of note.sources)sources.set(source.url,source)}
    if(skill.effectRules?.unknowns?.length){const heading=document.createElement('b');heading.textContent='未確認の項目';conditions.append(heading);for(const text of skill.effectRules.unknowns){const p=document.createElement('p');p.className='note';p.textContent=text;conditions.append(p)}}
    for(const source of sources.values()){const p=document.createElement('p'),link=document.createElement('a');link.href=source.url;link.textContent=source.title;link.target='_blank';link.rel='noopener';p.append(link);conditions.append(p)}
    item.append(conditions);
   }
   const heading=document.createElement('div');heading.className='psg-skill-species-label';heading.textContent='このスキルを持つポケモン';item.append(heading);
   const links=document.createElement('div');links.className='psg-skill-species';
   if(!species.length&&!skill.nativeSpecies?.length){const empty=document.createElement('span');empty.textContent='現在の図鑑に登録なし';links.append(empty)}
   for(const p of skill.nativeSpecies||[]){if(species.some(s=>s.speciesId===p.speciesId))continue;const pending=document.createElement('span');pending.className='note';pending.textContent=`${p.name}（図鑑追加待ち）`;links.append(pending)}
   species.forEach(p=>{
    const button=document.createElement('button');button.type='button';button.className='btn';button.textContent=`No.${String(p.no).padStart(3,'0')} ${p.name}`;
    button.onclick=()=>window.openPokemonDetail?.(p.speciesId||p.no,{pushHistory:false});links.append(button);
   });item.append(links);list.append(item);
  });
 }
 input.addEventListener('input',render);render();
 const reference=document.getElementById('friendshipReferenceContent'),friendship=catalog.friendship;
 if(reference&&friendship){
  const medals=friendship.medals,rules=friendship.subskillRules;
  const paragraph=(text)=>{const p=document.createElement('p');p.textContent=text;reference.append(p)};
  paragraph('資料確認・'+medals['確認日']+'。必要フレンドポイント（FP）とフレンドレベル（FL）は別です。');
  const search=document.createElement('input');search.type='search';search.placeholder='名前でメダルを検索';search.setAttribute('aria-label','フレンドメダルの名前検索');search.style.cssText='width:100%;box-sizing:border-box';reference.append(search);
  const results=document.createElement('div');results.id='friendshipMedalResults';reference.append(results);
  function renderMedals(){
   results.replaceChildren();const query=search.value.trim();if(!query){const hint=document.createElement('p');hint.textContent='名前を入力すると獲得FLを表示します（資料248件）。';results.append(hint);return}const matches=medals['ポケモン'].filter(r=>r['名前'].includes(query));
   const status=document.createElement('p');status.textContent=`${matches.length}件（資料収録数。アプリの図鑑件数とは別）`;results.append(status);
   for(const row of matches){const p=document.createElement('p');const title=document.createElement('strong');title.textContent=row['名前'];p.append(title,document.createElement('br'));p.append(row['銅獲得FL']==null?'対象外：フレンドレベルなし':`銅 FL${row['銅獲得FL']} ／ 銀 FL${row['銀獲得FL']} ／ 金 FL${row['金獲得FL']}`);results.append(p)}
  }
  search.addEventListener('input',renderMedals);renderMedals();
  for(const rank of ['銅','銀','金']){const rule=medals['保証仕様'][rank];paragraph(`${rank}メダル：Lv.${rule['解放Lv'].join('・')}枠が金色確定。${rule['色違い']}。${rule['ON_OFF']||''}`)}
  paragraph('金確定枠間：'+medals['保証仕様']['金確定枠間']);
  medals['管理仕様'].forEach(paragraph);
  paragraph('金スキルの選択重み・色違い確率と倍率は未確認。確率計算には使いません。');
  const heading=document.createElement('h3');heading.textContent='サブスキルの解放・たね';reference.append(heading);
  paragraph('解放Lv：'+rules['解放レベル'].join('・')+'。'+rules['解放レベル状態']+'。資料上の現在Lv上限：'+rules['現在Lv上限']+'。');
  paragraph('同名同ランクは重複不可。同系統の別ランクは併用可能。'+rules['重複']['効果の合成']+'。時間短縮率の上限は'+rules['重複']['時間短縮率上限pct']+'%（'+rules['重複']['短縮率上限対象']+'）。'+rules['重複']['性格']+'。');
  paragraph('サブスキルのたね：'+rules['たね']['対象']+'。'+rules['たね']['対象の選択']+'。対象間の正確な重みは未確認。');
  paragraph('手元での進化：'+rules['直接入手した進化個体']['手元で進化させる場合']);
  paragraph(rules['特殊個体']);
  paragraph('通常個体の正確な抽選重み・各枠の独立性・再抽選順序は未確認。参考観測は2023年の資料で、現行の確率として固定しません。');
  const sources=document.createElement('details');const summary=document.createElement('summary');summary.textContent='出典';sources.append(summary);
  for(const url of new Set([...medals['出典'],...rules['出典']])){const p=document.createElement('p'),a=document.createElement('a');a.href=url;a.textContent=url;a.target='_blank';a.rel='noopener noreferrer';a.style.overflowWrap='anywhere';p.append(a);sources.append(p)}reference.append(sources);
 }
})();
</script>
