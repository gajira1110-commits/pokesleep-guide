<script id="stable-v2-controller">
(()=>{'use strict';
const state={screen:'home',history:[],box:[],selected:null,selectedDex:null,
filters:{types:new Set(),ingredients:new Set(),specs:new Set()},
boxFilters:{types:new Set(),ingredients:new Set(),specs:new Set(),tags:new Set()}};
/* One source of truth. No Pokémon values are carried over from the unstable builds. */
const master={
 pokemon:[], ingredients:[],
 rules:{version:'stable-v3',verifiedAt:null}
};
const BOX_STORAGE_KEY='psg.box.instances.v1';
const SLEEP_STORAGE_KEY='psg-sleep-discoveries-v1';
const TEAM_STORAGE_KEY='psg.team.primary.v1';
const FIELD_STORAGE_KEY='psg.field.profile.v1';
const boxCatalog=()=>Object.values(window.PS_CATALOG?.pokemon||{}).filter(p=>p.dexVisible);
function normalizeBox(raw){
  if(!Array.isArray(raw))return [];
  const known=new Map(boxCatalog().map(p=>[Number(p.no),p]));
  const seen=new Set();
  return raw.filter(x=>{
    if(!x||typeof x.id!=='string'||! /^[a-zA-Z0-9-]{1,100}$/.test(x.id)||seen.has(x.id)||!known.has(Number(x.no))||!Number.isInteger(x.level)||x.level<1||x.level>100)return false;
    seen.add(x.id);return true;
  })
   .map(x=>({id:x.id,no:Number(x.no),level:Math.min(70,x.level),name:known.get(Number(x.no)).name,
    specialty:known.get(Number(x.no)).specialty,
    ingredients:x.ingredients&&typeof x.ingredients==='object'?x.ingredients:{},
    subskills:Array.isArray(x.subskills)?x.subskills.slice(0,5).map(s=>String(s||'').slice(0,80)):[],
    nature:String(x.nature||'').slice(0,40),mint:x.mint===true,
    skillLevel:Number.isInteger(x.skillLevel)?Math.max(1,Math.min(7,x.skillLevel)):1,
    role:String(x.role||'').slice(0,40),favorite:x.favorite===true,training:x.training===true,ribbonHours:[0,200,500,1000,2000].includes(x.ribbonHours)?x.ribbonHours:0}));
}
function readBox(){
 try{return normalizeBox(JSON.parse(localStorage.getItem(BOX_STORAGE_KEY)||'[]'))}
 catch{return []}
}
function commitBox(next){
 try{
  localStorage.setItem(BOX_STORAGE_KEY,JSON.stringify(next.map(({id,no,level,ingredients,subskills,nature,mint,skillLevel,role,favorite,training,ribbonHours})=>
   ({id,no,level,ingredients,subskills,nature,mint,skillLevel,role,favorite,training,ribbonHours}))));
  state.box=next;
  renderBox();
  return true;
 }catch{alert('保存できませんでした。ブラウザーの保存設定を確認してください。');return false}
}
state.box=readBox();
function normalizeTeam(raw,box){
 const byId=new Map(box.map(x=>[x.id,x])),seen=new Set();let hasSpecial=false;
 return Array.from({length:5},(_,i)=>{
  const id=Array.isArray(raw)?raw[i]:null;
  if(typeof id!=='string'||!byId.has(id)||seen.has(id))return null;
  const special=window.PS_CATALOG?.pokemon?.[byId.get(id).no]?.specialTeamLimited===true;
  if(special&&hasSpecial)return null;
  if(special)hasSpecial=true;
  seen.add(id);return id;
 });
}
function readTeam(){
 try{return normalizeTeam(JSON.parse(localStorage.getItem(TEAM_STORAGE_KEY)||'[]'),state.box)}catch{return [null,null,null,null,null]}
}
let team=readTeam();
// Team composition for skill-specific rules. IDs are individual records;
// species/type/skill grouping is computed only when an effect asks for it.
function teamContext(){
 const members=team.map((id,slot)=>{
  const individual=state.box.find(x=>x.id===id);
  const species=individual&&window.PS_CATALOG?.pokemon[individual.no];
  return species?{slot,instanceId:individual.id,speciesNo:Number(species.no),type:species.type,mainSkillId:species.mainSkillId}:null;
 }).filter(Boolean);
 const speciesCounts={},skillCounts={},speciesByType={};
 members.forEach(member=>{
  speciesCounts[member.speciesNo]=(speciesCounts[member.speciesNo]||0)+1;
  if(member.mainSkillId)skillCounts[member.mainSkillId]=(skillCounts[member.mainSkillId]||0)+1;
  (speciesByType[member.type]??=new Set()).add(member.speciesNo);
 });
 return {members,speciesCounts,skillCounts,distinctSpeciesByType:Object.fromEntries(Object.entries(speciesByType).map(([type,ids])=>[type,ids.size]))};
}
function teamFoodContext(ids=team,box=state.box,catalog=window.PS_CATALOG){
 const confirmed=new Map(),unconfirmed=[];
 ids.forEach((id,position)=>{
  const individual=box.find(x=>x.id===id);
  if(!individual)return;
  const species=catalog?.pokemon?.[individual.no];
  const label=`${position+1}匹目 ${individual.name} Lv.${individual.level}`;
  if(!species?.ingredientSlots?.length){unconfirmed.push(`${label}：食材データ未確認`);return}
  species.ingredientSlots.filter(slot=>slot.unlock<=individual.level).forEach(slot=>{
   const candidates=slot.candidates||[];
   const chosen=individual.ingredients?.[slot.unlock];
   const candidate=candidates.length===1?candidates[0]:candidates.find(item=>item.name===chosen);
   if(!candidate){unconfirmed.push(`${label}：Lv.${slot.unlock}の食材未確認`);return}
   const providers=confirmed.get(candidate.name)||[];
   providers.push({id:individual.id,label,unlock:slot.unlock,qty:candidate.qty});
   confirmed.set(candidate.name,providers);
  });
 });
 return {confirmed,unconfirmed};
}
function teamFoodIcon(name){
 const img=document.createElement('img');
 const visual=window.PS_CATALOG?.ingredientVisual?.(name);
 const src=visual?.image||window.PS_INGREDIENT_FALLBACK_ICON?.(name);
 if(src){img.src=src;img.alt='';return img}
 const fallback=document.createElement('span');fallback.textContent=visual?.fallback||'◌';return fallback;
}
function renderTeamFood(){
 const ingredients=document.getElementById('teamIngredientList'),recipes=document.getElementById('teamRecipeList');
 if(!ingredients||!recipes)return;
 ingredients.replaceChildren();recipes.replaceChildren();
 const {confirmed,unconfirmed}=teamFoodContext();
 if(!team.some(Boolean)){
  const empty=document.createElement('p');empty.className='note';empty.textContent='チームを選ぶと、拾える食材を表示します。';ingredients.append(empty);
 }else{
  if(confirmed.size){
   const list=document.createElement('div');list.className='psg-team-food-list';
   for(const [name,providers] of confirmed){
    const chip=document.createElement('div');chip.className='psg-team-food-item';chip.append(teamFoodIcon(name));
    const words=document.createElement('span');const title=document.createElement('strong');title.textContent=name;
    const detail=document.createElement('small');detail.textContent=providers.map(x=>`${x.label}（Lv.${x.unlock} ×${x.qty}）`).join('、');
    words.append(title,detail);chip.append(words);list.append(chip);
   }ingredients.append(list);
  }else{const empty=document.createElement('p');empty.className='note';empty.textContent='確認できた食材はありません。';ingredients.append(empty)}
  if(unconfirmed.length){const note=document.createElement('p');note.className='note';note.textContent=`未確認：${unconfirmed.join('、')}`;ingredients.append(note)}
 }
 const catalogRecipes=Object.values(window.PS_CATALOG?.recipes||{});
 const selectedCategory=activeMealCategory();
 if(!selectedCategory){const hint=document.createElement('p');hint.className='note';hint.textContent='今週の料理を選ぶと、そのカテゴリの食材チェックを表示します。';recipes.append(hint);return}
 for(const category of [selectedCategory]){
  const categoryRecipes=catalogRecipes.filter(r=>r.category===category).sort((a,b)=>(b.energy?.max?.value||0)-(a.energy?.max?.value||0));
  if(!categoryRecipes.length)continue;
  const group=document.createElement('details');group.className='psg-team-recipe-group';group.dataset.category=category;
  group.open=true;
  const heading=document.createElement('summary');heading.className='psg-team-recipe-group-title';
  const title=document.createElement('strong');title.textContent=category;
  const count=document.createElement('small');
  const covered=categoryRecipes.filter(r=>r.ingredients.every(item=>confirmed.has(item.name))).length;
  count.textContent=team.some(Boolean)?`食材の種類 ${covered}/${categoryRecipes.length}品`:`${categoryRecipes.length}品`;
  heading.append(title,count);group.append(heading);
  const list=document.createElement('div');list.className='psg-team-recipe-items';
  for(const recipe of categoryRecipes){
   const missing=recipe.ingredients.filter(item=>!confirmed.has(item.name));
   const row=document.createElement('button');row.type='button';row.className='psg-team-recipe-row';row.dataset.mealCategory=category;
   const name=document.createElement('strong');name.textContent=recipe.name;
   const meta=document.createElement('span');meta.className='psg-team-recipe-meta';const verified=recipe.energy?.max,shown=verified||[...(recipe.energy?.observed||[])].sort((a,b)=>b.level-a.level)[0];meta.textContent=shown?`${verified?'':'確認値 '}Lv.${shown.level} ${shown.value.toLocaleString()} エナジー`:'エナジー未確認';
   const status=document.createElement('span');status.className=`psg-team-recipe-status ${missing.length?'is-unconfirmed':'is-covered'}`;
   status.textContent=!team.some(Boolean)?'チーム未設定':missing.length?`未確認：${missing.map(item=>item.name).join('・')}`:'食材の種類が揃う';
   row.append(name,meta,status);
   row.setAttribute('aria-label',`${recipe.name}、${status.textContent}、料理の詳細へ`);
   row.onclick=()=>window.PS_OPEN_RECIPE?.(recipe.id);
   list.append(row);
  }
  group.append(list);recipes.append(group);
 }
}
let teamBoxSlot=null;
let teamReorderMode=false,teamReorderFrom=null;
function saveTeamSelection(next){
 try{team=normalizeTeam(next,state.box);localStorage.setItem(TEAM_STORAGE_KEY,JSON.stringify(team));teamReorderFrom=null;renderTeam()}
 catch{document.getElementById('teamSummary').textContent='チームを保存できませんでした。端末の設定を確認してください。'}
}
function teamFace(individual){
 const art=document.createElement('span');art.className='psg-team-face';
 if(!individual){art.textContent='＋';return art}
 if(window.PS_FACE_ART?.usesSheet(individual.no)){art.append(window.PS_FACE_ART.element(individual.no,''));return art}
 const species=window.PS_CATALOG?.pokemon[individual.no];
 const src=window.PS_IMAGE_FILES.pokemonFaces?.[individual.no]||species?.faceImage||species?.image;
 if(!src){art.textContent='No image';return art}
 const img=document.createElement('img');img.src=src;img.alt='';img.onerror=()=>{img.remove();art.textContent='No image'};
 art.append(img);return art;
}
function subskillCardBadges(individual){
 return `<span class="psg-subskill-card-grid" aria-label="サブスキル">${SUBSKILL_LEVELS.map((unlock,i)=>{
  const name=individual?.subskills?.[i],src=window.PS_IMAGE_FILES.subskills?.[name];
  return `<span class="psg-box-mini-badge ${name?'':'is-unknown'} ${individual?.level<unlock?'is-locked':''}" title="Lv.${unlock}：${boxEsc(name||'未確認')}" aria-label="Lv.${unlock} ${boxEsc(name||'未確認')}">${src?`<img src="${src}" alt="">`:`<span>${name?'・':'?'}</span>`}</span>`;
 }).join('')}</span>`;
}
function renderTeam(){
 const panel=document.getElementById('teamSlots');panel.replaceChildren();
 team=normalizeTeam(team,state.box);
 const reorder=document.getElementById('teamReorder'),hint=document.getElementById('teamHint');
 reorder.disabled=team.filter(Boolean).length<2;
 if(reorder.disabled)teamReorderMode=false;
 reorder.textContent=teamReorderMode?'並び替えを終了':'並び替え';
 reorder.setAttribute('aria-pressed',String(teamReorderMode));
 hint.hidden=!teamReorderMode;
 hint.textContent=teamReorderFrom===null?'移動する個体を選び、移動先の枠をタップしてください。':`${teamReorderFrom+1}匹目を選択中。移動先の枠をタップしてください。`;
 const teamSpeeds=teamSpeedContext();
 team.forEach((id,index)=>{
  const individual=state.box.find(x=>x.id===id),boxPosition=state.box.findIndex(x=>x.id===id)+1;
  const row=document.createElement('div');row.className='psg-team-row';
  if(teamReorderMode)row.classList.add('is-reordering');
  if(teamReorderFrom===index)row.classList.add('is-reorder-source');
  const choose=document.createElement('button');choose.type='button';choose.className='psg-team-choose';
  if(individual)choose.classList.add(`type-${typeClass(window.PS_CATALOG?.pokemon?.[individual.no]?.type)}`);
  choose.setAttribute('aria-label',`${index+1}匹目：${individual?individual.name:'未設定'}。${teamReorderMode?'並び替える枠を選ぶ':'Boxで個体を選ぶ'}`);
  const name=document.createElement('strong');name.className='psg-team-card-name';name.textContent=individual?.name||'個体を選ぶ';choose.append(name);
  const artwork=document.createElement('span');artwork.className='psg-team-card-art';artwork.append(teamFace(individual));
  if(individual){const level=document.createElement('span');level.className='psg-team-card-level';level.textContent=`Lv.${individual.level}`;artwork.append(level)}
  choose.append(artwork);
  const identity=document.createElement('span');identity.className='psg-team-identity';
  const detail=document.createElement('small');detail.textContent=individual?`Box ${boxPosition}番`:'未設定';
  identity.append(detail);
  if(individual){
   const speed=document.createElement('small');speed.className='psg-team-speed';
   const corrected=teamSpeeds.members.get(individual.id);
   speed.textContent=corrected?.speed==null?'チームのおてつだい時間：未確認':`チーム：${corrected.speed.toLocaleString()}秒${corrected.speed!==corrected.soloSpeed&&corrected.soloSpeed!=null?`（単体 ${corrected.soloSpeed.toLocaleString()}秒）`:''}`;
   identity.append(speed);
  }
  choose.append(identity);
  if(individual)choose.insertAdjacentHTML('beforeend',subskillCardBadges(individual));
  const arrow=document.createElement('span');arrow.className='psg-team-choose-arrow';arrow.textContent=teamReorderMode?(teamReorderFrom===index?'選択中':'移動先'):'Boxで選ぶ';choose.append(arrow);
  choose.onclick=()=>{
   if(teamReorderMode){
    if(teamReorderFrom===null){if(!id)return;teamReorderFrom=index;renderTeam();return}
    if(teamReorderFrom===index){teamReorderFrom=null;renderTeam();return}
    const next=[...team];[next[index],next[teamReorderFrom]]=[next[teamReorderFrom],next[index]];saveTeamSelection(next);return;
   }
   teamBoxSlot=index;renderBoxTeamMode();renderBox();go('box');
  };
  const number=document.createElement('span');number.className='psg-team-number';number.textContent=String(index+1);
  row.append(number,choose);panel.append(row);
 });
 const selected=team.map(id=>state.box.find(x=>x.id===id)).filter(Boolean);
 const summary=document.getElementById('teamSummary');
 summary.textContent=state.box.length?`${selected.length} / 5匹を登録中${selected.length?`・得意：${[...new Set(selected.map(x=>x.specialty))].join('、')}`:''}${teamSpeeds.bonusCount?`・おてつだいボーナス ${teamSpeeds.bonusCount}匹（計${Math.round(teamSpeeds.bonus*100)}%短縮、個体ごと上限35%）`:''}`:'ボックスに個体を登録すると、ここでチームを組めます。';
 renderTeamFood();
 renderTeamDay();
 renderTeamFaceDock();
}
function renderTeamFaceDock(){
 const dock=document.getElementById('teamFaceDock');dock.replaceChildren();
 team.forEach((id,index)=>{
  const individual=state.box.find(item=>item.id===id);
  const cell=document.createElement('button');cell.type='button';cell.className='psg-team-face-dock-cell';
  cell.setAttribute('aria-label',`${index+1}匹目：${individual?.name||'未設定'}。チームへ戻る`);
  cell.append(teamFace(individual));cell.onclick=()=>document.querySelector('#home .psg-team-card').scrollIntoView({behavior:'smooth',block:'start'});
  dock.append(cell);
 });
 updateTeamFaceDock();
}
function updateTeamFaceDock(){
 const dock=document.getElementById('teamFaceDock');
 const teamCard=document.querySelector('#home .psg-team-card');
 dock.hidden=!document.getElementById('home').classList.contains('active')||teamCard.getBoundingClientRect().bottom>document.querySelector('.psg-app-header').getBoundingClientRect().bottom+8;
}
window.addEventListener('scroll',updateTeamFaceDock,{passive:true});
window.addEventListener('resize',updateTeamFaceDock,{passive:true});
document.getElementById('teamReorder').onclick=()=>{teamReorderMode=!teamReorderMode;teamReorderFrom=null;renderTeam()};
const backupBoxFields=({id,no,level,ingredients,subskills,nature,mint,skillLevel,role,favorite,training,ribbonHours})=>({id,no,level,ingredients,subskills,nature,mint,skillLevel,role,favorite,training,ribbonHours});
const knownSleepIds=new Set(Object.values(window.PS_CATALOG?.sleepStyles||{}).flat().map(s=>s.id));
function normalizeSleepFound(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))return {};
 return Object.fromEntries(Object.entries(raw).filter(([id,found])=>knownSleepIds.has(id)&&found===true));
}
function readSleepBackup(){
 try{return normalizeSleepFound(JSON.parse(localStorage.getItem(SLEEP_STORAGE_KEY)||'{}'))}
 catch{return {}}
}
const knownFieldIds=new Set(Object.keys(window.PS_CATALOG?.fields||{}));
const knownBerryNames=new Set(window.PS_CATALOG?.berryNames||Object.keys(window.PS_CATALOG?.berries||{}));
// Use the device's local week, beginning Monday at 04:00.
function currentFieldWeek(now=new Date()){
 const date=new Date(now.getTime()-4*60*60*1000);
 date.setDate(date.getDate()-((date.getDay()+6)%7));
 return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function normalizeFieldProfile(raw){
 const selectedFieldId=knownFieldIds.has(raw?.selectedFieldId)?raw.selectedFieldId:(knownFieldIds.has('greengrass')?'greengrass':[...knownFieldIds][0]||'');
 const areaBonuses={};
 for(const [id,value] of Object.entries(raw?.areaBonuses||{})){
  if(knownFieldIds.has(id)&&Number.isFinite(Number(value)))areaBonuses[id]=Math.max(0,Math.min(200,Number(value)));
 }
 const weekly={};
 for(const [id,entry] of Object.entries(raw?.weekly||{})){
  if(knownFieldIds.has(id)&&typeof entry?.weekKey==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(entry.weekKey)&&Array.isArray(entry.berries)){
   weekly[id]={weekKey:entry.weekKey,berries:entry.berries.slice(0,3).map(name=>knownBerryNames.has(name)?name:'')};
  }
 }
 const categories=['カレー・シチュー','サラダ','デザート・ドリンク'];
 const meal=raw?.meal&&typeof raw.meal.weekKey==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(raw.meal.weekKey)&&categories.includes(raw.meal.category)?{weekKey:raw.meal.weekKey,category:raw.meal.category}:null;
 return {selectedFieldId,areaBonuses,weekly,meal};
}
function readFieldProfile(){
 try{return normalizeFieldProfile(JSON.parse(localStorage.getItem(FIELD_STORAGE_KEY)||'{}'))}
 catch{return normalizeFieldProfile({})}
}
let fieldProfile=readFieldProfile();
function saveFieldProfile(){
 try{localStorage.setItem(FIELD_STORAGE_KEY,JSON.stringify(fieldProfile));renderFieldControls();renderTeamDay();renderTeamFood();return true}
 catch{fieldProfile=readFieldProfile();renderFieldControls();renderTeamFood();alert('フィールド設定を保存できませんでした。');return false}
}
const backupFile=document.getElementById('backupFile');
const backupPreview=document.getElementById('backupPreview');
const backupImport=document.getElementById('backupImport');
let pendingBackup=null;
document.getElementById('backupExport').onclick=()=>{
 try{
  const payload={format:'psg-user-data',version:3,exportedAt:new Date().toISOString(),box:state.box.map(backupBoxFields),sleepFound:readSleepBackup(),team:normalizeTeam(team,state.box),fields:normalizeFieldProfile(fieldProfile)};
  const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));
  const link=document.createElement('a');link.href=url;link.download=`PSG_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  backupPreview.textContent=`ボックス ${payload.box.length}件・寝顔 ${Object.keys(payload.sleepFound).length}件を書き出しました。`;
 }catch{backupPreview.textContent='書き出せませんでした。端末の設定を確認してください。'}
};
backupFile.onchange=async()=>{
 pendingBackup=null;backupImport.hidden=true;
 const file=backupFile.files?.[0];if(!file){backupPreview.textContent='ファイルを選ぶと内容を確認できます。';return}
 if(file.size>5*1024*1024){backupPreview.textContent='ファイルが大きすぎます（上限5MB）。';return}
 try{
  const parsed=JSON.parse(await file.text());
  if(parsed?.format!=='psg-user-data'||![1,2,3].includes(parsed.version)||!Array.isArray(parsed.box)||!parsed.sleepFound||typeof parsed.sleepFound!=='object'||Array.isArray(parsed.sleepFound)||parsed.version>=2&&!Array.isArray(parsed.team)||parsed.version===3&&(!parsed.fields||typeof parsed.fields!=='object'||Array.isArray(parsed.fields)))throw Error('形式');
  const box=normalizeBox(parsed.box),sleepFound=normalizeSleepFound(parsed.sleepFound);
  const importedTeam=normalizeTeam(parsed.team,box);
  if(parsed.box.length>0&&box.length===0)throw Error('ポケモンのデータが一致しません');
  const skipped=parsed.box.length-box.length+Object.keys(parsed.sleepFound).length-Object.keys(sleepFound).length;
  pendingBackup={box,sleepFound,team:importedTeam,fields:parsed.version===3?normalizeFieldProfile(parsed.fields):null};
  backupPreview.textContent=`ボックス ${box.length}件・チーム ${importedTeam.filter(Boolean).length}匹・寝顔 ${Object.keys(sleepFound).length}件を確認しました。${skipped?`未対応の記録 ${skipped}件を除外します。`:''}復元すると現在の記録を置き換えます。`;
  backupImport.hidden=false;
 }catch{backupPreview.textContent='読み込めませんでした。PokéSleep GuideのバックアップJSONを選んでください。'}
};
backupImport.onclick=()=>{
 if(!pendingBackup)return;
 if(!confirm(`現在のボックス ${state.box.length}件・寝顔 ${Object.keys(readSleepBackup()).length}件を、選択したバックアップに置き換えます。復元しますか？`))return;
 const oldBox=localStorage.getItem(BOX_STORAGE_KEY),oldSleep=localStorage.getItem(SLEEP_STORAGE_KEY),oldTeam=localStorage.getItem(TEAM_STORAGE_KEY),oldFields=localStorage.getItem(FIELD_STORAGE_KEY);
 try{
  localStorage.setItem(BOX_STORAGE_KEY,JSON.stringify(pendingBackup.box.map(backupBoxFields)));
  localStorage.setItem(SLEEP_STORAGE_KEY,JSON.stringify(pendingBackup.sleepFound));
  localStorage.setItem(TEAM_STORAGE_KEY,JSON.stringify(pendingBackup.team));
  if(pendingBackup.fields)localStorage.setItem(FIELD_STORAGE_KEY,JSON.stringify(pendingBackup.fields));
  fieldProfile=readFieldProfile();renderFieldControls();
  state.box=readBox();team=readTeam();renderBox();renderTeam();
  window.PSG_REFRESH_SLEEP_FOUND?.();
  backupPreview.textContent=`復元しました。ボックス ${state.box.length}件・寝顔 ${Object.keys(pendingBackup.sleepFound).length}件。`;
  pendingBackup=null;backupImport.hidden=true;backupFile.value='';
 }catch{
  try{
   if(oldBox===null)localStorage.removeItem(BOX_STORAGE_KEY);else localStorage.setItem(BOX_STORAGE_KEY,oldBox);
   if(oldSleep===null)localStorage.removeItem(SLEEP_STORAGE_KEY);else localStorage.setItem(SLEEP_STORAGE_KEY,oldSleep);

 const bar=document.getElementById('boxTeamMode');bar.hidden=teamBoxSlot===null;

const MAX_POKEMON_LEVEL=70; // Confirmed in official Ver.3.6.0 notice, 2026-06-25.
const SUBSKILL_LEVELS=[10,25,50,70,80];
// Individual corrections are deliberately separate from daily yield (energy, collection and camp are not fixed here).
const NATURE_ROWS=window.PS_CATALOG.natures.rows;
const NATURE_AXES=window.PS_CATALOG.natures.axes;
const NATURE_EFFECTS=Object.fromEntries(NATURE_ROWS.flatMap((row,up)=>row.map((name,down)=>[name,up===down?{}:{up:NATURE_AXES[up],down:NATURE_AXES[down]}])));
const SUBSKILLS=Object.fromEntries(window.PS_CATALOG.subskills.map(skill=>[skill.name,skill]));
const SUBSKILL_NAMES=window.PS_CATALOG.subskills.map(skill=>skill.name);
function individualCorrections(item,p,teamSpeedReduction=0){
 const effect=item.mint?{}:NATURE_EFFECTS[item.nature]||{};
 const active=SUBSKILL_LEVELS.filter(n=>n<=item.level).map((_,i)=>item.subskills?.[i]).filter(Boolean);
 const sum=kind=>active.reduce((total,name)=>total+(SUBSKILLS[name]?.effect===kind?SUBSKILLS[name].value||0:0),0);
 const natureFactor=axis=>effect.up===axis?window.PS_CATALOG.natures.factors[axis].up:effect.down===axis?window.PS_CATALOG.natures.factors[axis].down:1;
 const soloSpeedReduction=Math.min(.35,sum('speedReduction'));
 const speedReduction=Math.min(.35,sum('speedReduction')+teamSpeedReduction);
 const speedBase=Number.isFinite(p?.help)?p.help*(1-(item.level-1)*.002)*natureFactor('speed'):null;
 const soloSpeed=speedBase==null?null:Math.floor(speedBase*(1-soloSpeedReduction));
 const speed=speedBase==null?null:Math.floor(speedBase*(1-speedReduction));
 const foodFactor=natureFactor('food')*(1+sum('foodRateBonus'));
 const skillFactor=natureFactor('skill')*(1+sum('skillRateBonus'));
 const carry=Number.isFinite(p?.carry)?p.carry+sum('carryBonus'):null;
 const food=Number.isFinite(p?.foodRate)?Math.min(100,p.foodRate*foodFactor):null;
 const skill=Number.isFinite(p?.skillRate)?Math.min(100,p.skillRate*skillFactor):null;
 const unknown=[...active.filter(name=>!SUBSKILL_NAMES.includes(name)),...(!item.mint&&item.nature&&!NATURE_EFFECTS[item.nature]?[item.nature]:[])];
 return {speed,soloSpeed,carry,food,skill,foodFactor,skillFactor,active,unknown,
   nature:effect,berryQty:Number.isFinite(p?.berryQty)?p.berryQty+sum('berryQtyBonus'):null,
   teamBonus:sum('teamSpeedReduction')>0,energyFactor:natureFactor('energy'),expFactor:natureFactor('exp')};
}
function teamSpeedContext(ids=team,box=state.box,catalog=window.PS_CATALOG){
 const selected=ids.map(id=>box.find(item=>item.id===id)).filter(Boolean);
 const contribution=item=>SUBSKILL_LEVELS.reduce((sum,unlock,i)=>sum+(unlock<=item.level&&SUBSKILLS[item.subskills?.[i]]?.effect==='teamSpeedReduction'?SUBSKILLS[item.subskills[i]].value:0),0);
 const bonus=selected.reduce((sum,item)=>sum+contribution(item),0);
 const members=new Map(selected.map(item=>[item.id,individualCorrections(item,catalog?.pokemon?.[item.no],bonus)]));
 return {bonus,bonusCount:selected.filter(item=>contribution(item)>0).length,members};
}
