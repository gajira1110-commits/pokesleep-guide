<script id="psg-auto-image-paths">
/* Only verified species and registered asset IDs are queried. Missing files leave the existing UI alone. */
(()=>{'use strict';
const catalog=window.PS_CATALOG;
const assets=window.PS_DEV_ASSETS;
const explicit=window.PS_IMAGE_FILES;
const lookup=new Map();
function exists(path){
  if(!path)return Promise.resolve(false);
  if(lookup.has(path))return lookup.get(path);
  const task=new Promise(resolve=>{
    const image=new Image();
    image.onload=()=>resolve(image.naturalWidth>0);
    image.onerror=()=>resolve(false);
    image.src=path;
  });
  lookup.set(path,task);
  return task;
}
const jobs=[];
function tryPath(path,apply){jobs.push(exists(path).then(ok=>{if(ok){apply(path);return true}return false}))}
window.PS_TYPE_IMAGES={...window.PS_IMAGE_FILES.types};
// Center the visible pixels, rather than the uneven transparent sheet margins.
// Original files stay intact; all type-icon consumers share these display images.
function centeredTypeImage(source){
 return new Promise(resolve=>{
  const image=new Image();image.onerror=()=>resolve(null);
  image.onload=()=>{
   try{
    const scan=document.createElement('canvas');scan.width=image.naturalWidth;scan.height=image.naturalHeight;
    const ctx=scan.getContext('2d');ctx.drawImage(image,0,0);
    const pixels=ctx.getImageData(0,0,scan.width,scan.height).data;
    let left=scan.width,top=scan.height,right=-1,bottom=-1,bestSize=0;
    // Ignore disconnected fragments from neighboring cells in the source sheet.
    const seen=new Uint8Array(scan.width*scan.height);
    for(let start=0;start<seen.length;start++){
     if(seen[start]||pixels[start*4+3]<=8)continue;
     const stack=[start];seen[start]=1;let size=0,l=scan.width,t=scan.height,r=-1,b=-1;
     while(stack.length){
      const i=stack.pop(),x=i%scan.width,y=Math.floor(i/scan.width);size++;
      l=Math.min(l,x);t=Math.min(t,y);r=Math.max(r,x);b=Math.max(b,y);
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
       const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=scan.width||ny>=scan.height)continue;
       const n=ny*scan.width+nx;if(!seen[n]&&pixels[n*4+3]>8){seen[n]=1;stack.push(n)}
      }
     }
     if(size>bestSize){bestSize=size;left=l;top=t;right=r;bottom=b}
    }
    if(right<left){resolve(null);return}
    const width=right-left+1,height=bottom-top+1,scale=112/Math.max(width,height);
    const target=document.createElement('canvas');target.width=128;target.height=128;
    const draw=target.getContext('2d');draw.imageSmoothingEnabled=true;draw.imageSmoothingQuality="high";
    // Soften the coarse source pixel steps at display time; keep master artwork intact.
    draw.filter='blur(1.25px)';
    const w=Math.round(width*scale),h=Math.round(height*scale);
    draw.drawImage(image,left,top,width,height,Math.floor((128-w)/2),Math.floor((128-h)/2),w,h);
    resolve(target.toDataURL('image/png'));
   }catch{resolve(null)}
  };image.src=source;
 });
}
async function alignTypeImages(){
 const aligned=await Promise.all(Object.entries(window.PS_TYPE_IMAGES).map(async([name,source])=>{
  const centered=await centeredTypeImage(source);if(centered)window.PS_TYPE_IMAGES[name]=centered;return Boolean(centered);
 }));return aligned.some(Boolean);
}
// Re-extract complete circles from the original sheet; custom master icons retain priority.
const typeSheetConfig=/* PSG_BUILD_TYPE_SHEET */;
const typeSheet=new Image();
if(Object.keys(typeSheetConfig.icons).length)jobs.push(new Promise(resolve=>{
 typeSheet.onload=async()=>{
  try{
   for(const [name,[x,y,w,h]] of Object.entries(typeSheetConfig.icons)){
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(typeSheet,x,y,w,h,0,0,w,h);
    window.PS_TYPE_IMAGES[name]=canvas.toDataURL('image/png');
   }
   resolve(await alignTypeImages());
  }catch{resolve(await alignTypeImages())}
 };
 typeSheet.onerror=async()=>resolve(await alignTypeImages());
 typeSheet.src=typeSheetConfig.url;
}));
else jobs.push(alignTypeImages());
for(const pokemon of Object.values(catalog.pokemon)){
  if(!explicit.pokemon[pokemon.no]&&!pokemon.image){
    tryPath(assets.path('pokemon',pokemon.no,'full'),path=>{pokemon.image=path;if(!explicit.pokemonFaces[pokemon.no]&&!pokemon.faceImage)pokemon.faceImage=path});
  }
  if(!explicit.pokemonFaces[pokemon.no]){
    tryPath(assets.path('pokemon',pokemon.no,'face'),path=>{pokemon.faceImage=path});
  }
  if(pokemon.berry&&!explicit.berries[pokemon.berry]&&!pokemon.berryImage){
    tryPath(assets.path('berry',pokemon.berry),path=>{pokemon.berryImage=path});
  }
  for(const slot of pokemon.ingredientSlots||[])for(const candidate of slot.candidates||[]){
    const name=candidate.name,visual=catalog.ingredientAssets[name];
    if(!name||explicit.ingredients[name]||visual?.image)continue;
    tryPath(assets.path('ingredient',name),path=>{
      const current=catalog.ingredientAssets[name]||{};
      catalog.ingredientAssets[name]={...current,image:path};
    });
  }
  const skill=catalog.skills[pokemon.mainSkillId];
  if(skill&&!explicit.skills[skill.id]&&!skill.image){
    tryPath(assets.path('skill',skill.id),path=>{skill.image=path});
  }
}
window.PS_AUTO_ASSETS={ready:Promise.all(jobs).then(found=>{
  if(found.some(Boolean)){
    window.PS?.renderFilters();window.PS?.renderDex();window.PS?.renderBox();
    if(document.getElementById('boxDetail')?.classList.contains('active'))window.PS?.refreshBoxDetail?.();
    if(document.getElementById('dexDetail')?.classList.contains('active')){
      const label=document.querySelector('#dexDetail .v51-head-no')?.textContent||'';
      const no=Number(label.match(/No\.?\s*(\d+)/i)?.[1]);
      if(no)window.openPokemonDetail?.(no);
    }
  }
  return {found:found.filter(Boolean).length,checked:lookup.size};
})};
})();
</script>
