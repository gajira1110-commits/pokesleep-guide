<script id="stable-v12-controller">
(()=>{
 const V=window.PS_CATALOG;if(!V)return;
 const detailEsc=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
 let currentNo=1,currentTab="ability";
 const byNo=n=>V.pokemon[Number(n)]||null;
 const neighborOf=(no,direction)=>{
   const knownNos=Object.values(V.pokemon)
     .filter(p=>p&&Number.isInteger(Number(p.no))&&p.name)
     .map(p=>Number(p.no)).sort((a,b)=>a-b);
   const index=knownNos.indexOf(Number(no));
   return index<0?null:byNo(knownNos[index+direction]);
 };
 const skillOf=m=>m?V.skills[m.mainSkillId]:null;

 const TYPE_THEME={
   "ノーマル":["#f5f3ea","#9b9686"],"ほのお":["#fff0e8","#ef7b52"],
   "みず":["#e9f4ff","#5c9fdb"],"でんき":["#fff8d9","#d7ae35"],
   "くさ":["#e8f7ec","#55a66b"],"こおり":["#e7f7fa","#62b9c4"],
   "かくとう":["#f7e9e6","#b66a5d"],"どく":["#f3e9f8","#9568ad"],
   "じめん":["#f5eee1","#b28b56"],"ひこう":["#edf1fb","#849bc8"],
   "エスパー":["#f9eaf1","#c76f96"],"むし":["#f1f5df","#91a44e"],
   "いわ":["#f1ede2","#9f8c5b"],"ゴースト":["#eeeafa","#756da9"],
   "ドラゴン":["#eceafb","#7067bd"],"あく":["#ecebea","#69635f"],
   "はがね":["#eef2f4","#82939c"],"フェアリー":["#faeaf2","#c77c9f"]
 };
 const TYPE_ICONS={
   "くさ":"🌿","ほのお":"🔥","みず":"💧","でんき":"⚡","こおり":"❄️",
   "かくとう":"🥊","どく":"☠️","じめん":"⛰️","ひこう":"🪽","エスパー":"🔮",
   "むし":"🐛","いわ":"🪨","ゴースト":"👻","ドラゴン":"🐉","あく":"🌑",
   "はがね":"⚙️","フェアリー":"✨","ノーマル":"◯"
 };
 const iconForType=type=>TYPE_ICONS[type]||"◯";
 function setTheme(type){
   const [bg,accent]=TYPE_THEME[type]||["#f3f6f4","#718078"];
   const d=document.getElementById("dexDetail");
   d.style.setProperty("--type-bg",bg);d.style.setProperty("--type-accent",accent);
 }
 function show(id){
   document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("active",x.id===id));
   if(window.PS?.state)window.PS.state.screen=id;
   window.scrollTo(0,0);
 }
 // v30: app-local detail history. Keeps evolution jumps reversible without relying on browser history.
 const detailHistory=[],detailForward=[];
 let detailOrigin="dex";
 const info=document.querySelector("#dexDetail .hero-info");
 const stats=document.querySelector("#dexDetail .hero > .stats")||document.querySelector("#dexDetail .hero-info .stats");
 if(info&&stats&&stats.parentElement!==info) info.appendChild(stats);

 // Remove legacy duplicated identity/traits and legacy tab strip.
 ["detailTraits","detailName"].forEach(id=>document.getElementById(id)?.remove());
 document.querySelectorAll("#dexDetail .detail-tabs").forEach(x=>x.remove());

 // Resolve the hero before it is referenced below.
 // v54 referenced `hero` before this const declaration, which throws a ReferenceError
 // and aborts the whole detail controller before openDexCard is registered.
 const hero=document.querySelector("#dexDetail .hero");
 let tabs=document.getElementById("v12Tabs");
 if(!tabs){
   tabs=document.createElement("div");tabs.id="v12Tabs";tabs.className="v12-tabs";
   tabs.innerHTML='<button data-v12tab="ability">基本能力</button><button data-v12tab="sleep">寝顔図鑑 <span class="psg-sleep-tab-count"></span></button><button data-v12tab="field">フィールド</button>';
   hero?.appendChild(tabs);
 }
 // Everything after hero becomes the switchable area. Existing ability sections are grouped.
 let ability=document.getElementById("v12Ability");
 if(!ability){
   ability=document.createElement("div");ability.id="v12Ability";ability.className="v12-panel";
   const movable=[];
   let node=hero?.nextElementSibling;
   while(node){
     const next=node.nextElementSibling;
     if(!node.matches("nav,.bottom-nav")) movable.push(node);
     node=next;
   }
   movable.forEach(n=>ability.appendChild(n));
   hero?.after(ability);
 }
 
 // Remove legacy headings/table header that are replaced by the current renderers.
 // This fixes the visible duplicate UI without deleting the CSS/layout that v17 relies on.
 ability.querySelectorAll(".ability-card").forEach(card=>{
   const title=card.querySelector(":scope > .ability-title");
   const legacyFoodHead=card.querySelector(":scope > .food-table-head");
   if(title) title.remove();
   if(legacyFoodHead) legacyFoodHead.remove();
 });

 let sleep=document.getElementById("v12Sleep");
 if(!sleep){sleep=document.createElement("div");sleep.id="v12Sleep";sleep.className="v12-panel";ability.after(sleep)}
 let field=document.getElementById("v12Field");
 if(!field){field=document.createElement("div");field.id="v12Field";field.className="v12-panel";field.innerHTML='<div class="v12-placeholder">フィールドデータをここに表示します</div>';sleep.after(field)}
 // Pin identity and tab navigation together, while keeping the tabs outside the type-colored card.
 let sticky=document.getElementById('psgDexSticky');
 if(!sticky){
   sticky=document.createElement('div');sticky.id='psgDexSticky';sticky.className='psg-dex-sticky';
   hero.before(sticky);sticky.append(hero,tabs);
 }

 // Discoveries are stored by permanent sleep-style ID, never by position or name.
 const SLEEP_FOUND_KEY='psg-sleep-discoveries-v1';
 function readSleepFound(){
   try{
     const saved=JSON.parse(localStorage.getItem(SLEEP_FOUND_KEY)||'{}');
     return saved&&typeof saved==='object'&&!Array.isArray(saved)?saved:{};
   }catch{return {}}
 }
 let sleepFound=readSleepFound();
 function renderSleepStyles(m){
   sleep.replaceChildren();
   const styles=(V.sleepStyles?.[m.no]||[]).filter(x=>x&&x.id&&Number.isInteger(Number(x.stars))&&Number(x.stars)>=1&&Number(x.stars)<=5)
     .slice().sort((a,b)=>Number(a.stars)-Number(b.stars)||Number(a.order||0)-Number(b.order||0)||String(a.id).localeCompare(String(b.id)));
   const registered=styles.filter(x=>sleepFound[x.id]).length;
   const sleepTab=tabs.querySelector('[data-v12tab="sleep"]');
   sleepTab.querySelector('.psg-sleep-tab-count').textContent=`${registered}/${styles.length}`;
   sleepTab.setAttribute('aria-label',`寝顔図鑑、${styles.length}種類中${registered}種類登録済み`);
   if(!styles.length){
     const empty=document.createElement('p');empty.className='psg-sleep-empty';
     empty.textContent='寝顔データ未登録。確認できた寝顔をマスターデータに追加すると、ここに★順で表示します。';
     sleep.appendChild(empty);return;
   }
   const grid=document.createElement('div');grid.className='psg-sleep-grid';
   styles.forEach(style=>{
     const card=document.createElement('article');card.className='psg-sleep-card';
     const photo=document.createElement('div');photo.className='psg-sleep-photo';
     const fallback=document.createElement('span');fallback.className='psg-sleep-no-image';fallback.textContent='No image';
     if(style.image){
       const img=document.createElement('img');img.src=style.image;img.alt=style.name||'寝顔';img.loading='lazy';
       img.onerror=()=>{img.remove();photo.appendChild(fallback)};
       photo.appendChild(img);
     }else photo.appendChild(fallback);
     const toggle=document.createElement('button');toggle.type='button';toggle.className='psg-sleep-toggle';
     toggle.setAttribute('aria-pressed',sleepFound[style.id]?'true':'false');
     toggle.setAttribute('aria-label',`${m.name} ${style.name||'寝顔'} ${sleepFound[style.id]?'登録済み。タップして未登録にする':'未登録。タップして登録する'}`);
     toggle.textContent=sleepFound[style.id]?'✓':'○';
     toggle.onclick=()=>{
       const updated={...sleepFound};
       if(updated[style.id])delete updated[style.id];else updated[style.id]=true;
       try{localStorage.setItem(SLEEP_FOUND_KEY,JSON.stringify(updated));sleepFound=updated;renderSleepStyles(m)}
       catch{toggle.setAttribute('aria-label','保存できませんでした。端末の保存設定を確認してください')}
     };
     photo.appendChild(toggle);card.appendChild(photo);
     const caption=document.createElement('div');caption.className='psg-sleep-caption';
     const stars=document.createElement('strong');stars.className='psg-sleep-stars';stars.textContent=`★${style.stars}`;
     const name=document.createElement('span');name.textContent=style.name||'名称未確認';
     caption.append(stars,name);card.appendChild(caption);grid.appendChild(card);
   });
   sleep.appendChild(grid);
 }
 function renderPokemonFields(m){
   field.replaceChildren();
   const title=document.createElement('h3');title.textContent='フィールド別の寝顔・最低ランク';field.append(title);
   const note=document.createElement('p');note.className='note';note.textContent='資料を投入した出現情報のみ表示。未掲載は出現しないという意味ではありません。';field.append(note);
   let found=false;
   for(const entry of Object.values(V.fields||{})){
     const rows=(entry.encounters||[]).filter(row=>Number(row.sleepStyleId.split('_')[0])===m.no);
     if(!rows.length)continue;
     found=true;
     const section=document.createElement('section');section.className='psg-field-species';
     const heading=document.createElement('h4');heading.textContent=entry.name;section.append(heading);
     for(const item of rows){
       const style=V.sleepStyles?.[m.no]?.find(row=>row[2]===item.sleepStyleId);
       if(!style)continue;
       const line=document.createElement('div');line.className='psg-field-encounter-row';
       const label=document.createElement('span');label.textContent=`★${style[1]} ${style[0]}`;
       const rank=document.createElement('strong');rank.textContent=`${item.rank.tier}${item.rank.level}から`;
       line.append(label,rank);section.append(line);
     }
     field.append(section);
   }
   if(!found){const empty=document.createElement('p');empty.className='v12-placeholder';empty.textContent='フィールド出現データ未投入';field.append(empty)}
 }
 window.PSG_REFRESH_SLEEP_FOUND=()=>{
   sleepFound=readSleepFound();
   const pokemon=byNo(currentNo);
   if(pokemon)renderSleepStyles(pokemon);
 };

 function switchTab(tab){
   currentTab=tab;
   [["ability",ability],["sleep",sleep],["field",field]].forEach(([k,p])=>p.classList.toggle("active",k===tab));
   tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.v12tab===tab));
 }
 tabs.onclick=e=>{const b=e.target.closest("[data-v12tab]");if(b)switchTab(b.dataset.v12tab)};

 function header(m){
   let h=document.getElementById("v12Header");
   if(!h){h=document.createElement("div");h.id="v12Header";info.prepend(h)}
   const prev=neighborOf(m.no,-1),next=neighborOf(m.no,1);
   const berryQty=m.berryQtyOverride??m.berryQty;

   // v51: 1-2 + previous/next move into the sticky detail header.
   const head=document.querySelector("#dexDetail .detail-head");
   if(head){
     const title=head.querySelector("h2");
     if(title) title.innerHTML=`<span class="v51-head-no">No.${String(m.no).padStart(3,"0")}</span><span class="v51-head-name">${m.name}</span>`;
     head.querySelector(".v51-head-nav")?.remove();
     const nav=document.createElement("div");
     nav.className="v51-head-nav";
     nav.innerHTML=`<button id="v12Prev" aria-label="前のポケモン" ${prev?"":"disabled"}>‹</button><button id="v12Next" aria-label="次のポケモン" ${next?"":"disabled"}>›</button>`;
     head.appendChild(nav);
   }

   // v51: right side line 1 = former 1-3 (3 columns). Identity/type no longer consumes this area.
   h.innerHTML=`<div class="v19-traits">
     <span class="v44-berry-trait"><span class="v44-berry-visual" title="${m.berry||'きのみ'}">${m.berryImage?window.PS_DEV_ASSETS.image(m.berryImage,'berry',m.berry,'full',m.berry):'<small class="psg-mini-missing" aria-label="No image">No<br>image</small>'}</span><b>${berryQty==null?"未確認":`×${berryQty}`}</b></span>
     <span class="v44-sleep-trait">${window.PS_SLEEP_ICON(m.sleepType)} ${m.sleepType}</span>
     <span class="v44-specialty-trait" title="得意：${m.specialty}" aria-label="得意：${m.specialty}">${window.PS_SPECIALTY_IMAGES?.[({"きのみ":"berry","食材":"ingredient","スキル":"skill","オール":"all"})[m.specialty]]?`<img class="psg-specialty-icon" src="${window.PS_SPECIALTY_IMAGES[({"きのみ":"berry","食材":"ingredient","スキル":"skill","オール":"all"})[m.specialty]]}" alt="">`:m.specialty}</span>
   </div>`;

   // Keep artwork square and place the compact trait row beneath it.
   const heroTop=document.querySelector('#dexDetail .hero-top');
   let media=heroTop?.querySelector('.psg-v106-media');
   if(heroTop&&!media){media=document.createElement('div');media.className='psg-v106-media';heroTop.prepend(media);media.appendChild(document.getElementById('detailArt'))}
   const heroInfo=heroTop?.querySelector('.hero-info');
   if(heroInfo)heroInfo.insertBefore(h,heroInfo.querySelector('.stats'));
   // Type belongs to the artwork, at its lower-right corner.
   const art=document.getElementById("detailArt");
   if(art){
     art.replaceChildren();
     const preview=window.PS_DEV_ASSETS;
     const img=document.createElement('img');
     const expected=preview.path('pokemon',m.no,'full');
     img.src=m.image||preview.preview(expected);
     img.alt=m.name;
     img.classList.toggle('psg-asset-preview',!m.image);
     img.title=preview.title(expected);
     if(m.image)img.dataset.previewPath=expected;
     art.appendChild(img);
     const badge=document.createElement("span");
     badge.className="v51-type-badge";
     badge.title="タイプ："+m.type;badge.setAttribute("aria-label",badge.title);
     badge.innerHTML=window.PS_TYPE_ART?.(m.type)||iconForType(m.type);
     art.appendChild(badge);
   }
 }
 function renderStats(m){
   stats.innerHTML=`<div class="stat"><small><span class="v45-stat-icon">⏱</span><span class="v45-stat-text">おてつだい時間</span></small><b>${m.help?.toLocaleString()||"—"}秒</b></div>
   <div class="stat"><small><span class="v45-stat-icon">🎒</span><span class="v45-stat-text">最大所持数</span></small><b>${m.carry??"未確認"}</b></div>
   <div class="stat"><small><span class="v45-stat-icon">🥕</span><span class="v45-stat-text">食材確率</span></small><b>${m.foodRate??"—"}%</b></div>
   <div class="stat"><small><span class="v45-stat-icon">✨</span><span class="v45-stat-text">スキル発動確率</span></small><b>${m.skillRate??"—"}%</b></div>`;
 }
 function renderFood(m){
   const host=document.getElementById('detailFoods');
   document.getElementById('foodRateBadge')?.style.setProperty('display','none');
   if(!host)return;
   const rows=(m.ingredients||[]).map((x,i)=>{
     const image=V.ingredientVisual(x.name)?.image;
     const iconSource=image||window.PS_INGREDIENT_FALLBACK_ICON?.(x.name);
     const visual=iconSource?`<img src="${iconSource}" alt="${x.name}">`:`<span class="psg-food-fallback">${x.name||'未確認'}</span>`;
     const quantities=(x.qty||[]).map(n=>`<div class="psg-food-level"><strong>${n==null?'—':n+'個'}</strong></div>`).join('');
     const knownRecipes=V.recipesByIngredient?.[x.name]||[];
     const tiles=knownRecipes.map(recipe=>`<div class="psg-food-recipe-tile" data-meal-category="${recipe.category||''}" title="${recipe.name||'料理'}" aria-label="${recipe.name||'料理'}${recipe.amount!=null?' '+recipe.amount+'個':''}">${recipe.image?`<img src="${recipe.image}" alt="">`:'<span class="psg-food-recipe-missing" aria-hidden="true">🍽</span>'}${recipe.amount!=null?`<small>${recipe.amount}</small>`:''}</div>`).join('');
     const recipes=knownRecipes.length?`<div class="psg-food-recipes"><div class="psg-food-recipe-strip">${tiles}</div></div>`:'<div class="psg-food-recipes is-pending"><span class="psg-food-pending">データ未確認</span></div>';
     return `<div class="psg-food-row" data-slot="${x.slot||['A','B','C'][i]}"><div class="psg-food-id"><b>${x.slot||['A','B','C'][i]}</b>${visual}</div><div class="psg-food-levels">${quantities}</div>${recipes}</div>`;
   }).join('');
   host.innerHTML=`<div class="psg-food-head"><div class="psg-food-rate"><span>食材</span><strong>${m.foodRate!=null?m.foodRate+'%':'未確認'}</strong></div><div class="psg-food-head-levels"><span></span><span>Lv.30</span><span>Lv.60</span></div><b>対応料理</b></div>${rows?`<div class="psg-food-stack">${rows}</div>`:'<p class="unknown">食材データ未確認</p>'}`;
 }
 function renderSkill(m){
   const s=skillOf(m);if(!s)return;
   const skillIcon=document.querySelector('#v12Ability .skill-icon');
   if(skillIcon){
     skillIcon.replaceChildren();
     const path=window.PS_DEV_ASSETS.path('skill',s.id);
     skillIcon.classList.toggle('has-image',!!s.image);
     if(s.image){const img=document.createElement('img');img.src=s.image;img.alt=s.name;img.title=window.PS_DEV_ASSETS.title(path);if(path)img.dataset.previewPath=path;skillIcon.appendChild(img)}
   }
   const badge=document.getElementById("skillRateBadge");
   if(badge)badge.style.display="none";
   const name=document.getElementById("detailSkill");
   if(name)name.textContent=s.name;
   const rate=document.getElementById("skillRateInline");
   if(rate)rate.innerHTML=`発動確率 <strong>${m.skillRate!=null?m.skillRate+"%":"未確認"}</strong>`;
   const lv1=s.levels?.[1];
   const effect=document.getElementById("detailSkillEffect");
   if(effect){
     const effectCopy=s.effectType==='random_ingredients'&&lv1?.amount!=null?`ランダムな食材を <strong class="skill-var effect-food">${lv1.amount}個</strong> ゲットする。`:s.effectType==='fixed_energy'&&lv1?.energy!=null?`カビゴンのエナジーを <strong class="skill-var">${lv1.energy.toLocaleString()}</strong> 増やす。`:s.effectType==='variable_energy'&&lv1?.min!=null&&lv1?.max!=null?`カビゴンのエナジーを <strong class="skill-var">${lv1.min.toLocaleString()}～${lv1.max.toLocaleString()}</strong> 増やす。`:s.effectType==='team_energy_recovery'&&lv1?.recovery!=null?`チーム全員のげんきを <strong class="skill-var">${lv1.recovery}</strong> 回復する。`:lv1?.description?detailEsc(lv1.description):'効果未確認';
     effect.innerHTML=`<b class="v35-effect-level">Lv.1</b><span class="v35-effect-copy">${effectCopy}</span>`;
     effect.classList.add("skill-desc");
   }
   // Dex is reference-only: no skill-level adjustment control here.
   const ctl=document.getElementById("v12SkillLv");
   if(ctl)ctl.remove();
   const levels=document.getElementById("skillLevels");
   if(levels){
     const detail=Object.entries(s.levels||{}).filter(([lv])=>Number(lv)>1).sort((a,b)=>Number(a[0])-Number(b[0]));
     const simpleCompact = detail.length===6 && detail.every(([lv,x])=>x && (x.amount!=null||x.energy!=null||x.recovery!=null||x.helps!=null) && String(x.amount??x.energy??x.recovery??x.helps).length<=4);
     const layoutClass = simpleCompact ? "v43-compact-3" : (detail.length<=6 ? "v43-compact-2" : "v43-detail-long");
     levels.innerHTML=`<div class="v32-skill-grid ${layoutClass}">${detail.map(([lv,x])=>`<div class="v32-skill-cell"><b>Lv.${lv}</b><strong class="skill-var effect-food">${s.effectType==='random_ingredients'&&x.amount!=null?x.amount+'個':s.effectType==='fixed_energy'&&x.energy!=null?x.energy.toLocaleString():s.effectType==='variable_energy'&&x.min!=null&&x.max!=null?x.min.toLocaleString()+'～'+x.max.toLocaleString():s.effectType==='team_energy_recovery'&&x.recovery!=null?'全員＋'+x.recovery:s.effectType==='self_energy_recovery'&&x.recovery!=null?'自分＋'+x.recovery:s.effectType==='ally_energy_recovery'&&x.recovery!=null?'1匹＋'+x.recovery:s.effectType==='extra_help'&&x.helps!=null?'おてつだい'+x.helps+'回':x.description?detailEsc(x.description):'効果未確認'}</strong></div>`).join("")}</div>`;
   }
 }
 function evolutionEntries(m){
   if(!m?.evolution)return [];
   return Array.isArray(m.evolution)?m.evolution:[m.evolution];
 }
 function evolutionConditions(e){
   if(Array.isArray(e.conditions)&&e.conditions.length)return e.conditions;
   const out=[];
   if(e.level!=null)out.push(`Lv.${e.level}`);
   if(e.candy!=null)out.push(`アメ${e.candy}個`);
   if(e.item)out.push(e.item);
   if(e.extra)out.push(e.extra);
   return out.length?out:["条件未確認"];
 }
 function parentsOf(no){
   return Object.values(V.pokemon).filter(p=>evolutionEntries(p).some(e=>Number(e.toNo)===Number(no)));
 }
 function rootOf(m){
   let cur=m,seen=new Set();
   while(cur&&!seen.has(cur.no)){
     seen.add(cur.no);const ps=parentsOf(cur.no);if(!ps.length)break;cur=ps[0];
   }
   return cur||m;
 }
 function descendantsOf(root){
   const out=[],seen=new Set();
   const walk=p=>{if(!p||seen.has(p.no))return;seen.add(p.no);out.push(p);evolutionEntries(p).forEach(e=>walk(byNo(e.toNo)))};
   walk(root);return out;
 }
 function evoNode(p,currentNo,cls="",condition=null,incoming=false){
   if(!p)return "";
   const face=window.PS_IMAGE_FILES.pokemonFaces?.[p.no]||(p.faceImage&&p.faceImage!==p.image?p.faceImage:null);
   const image=window.PS_DEV_ASSETS.image(face,'pokemon',p.no,'face',p.name);
   const isCurrent=Number(p.no)===Number(currentNo);
   const conditions=condition?`<span class="v106-evo-conditions">${evolutionConditions(condition).map((x,i)=>`<span>${x}${i===0&&!incoming?'<span class="v111-evo-next" aria-hidden="true">›</span>':''}</span>`).join("")}</span>`:"";
   return `<button class="v31-evo-node ${isCurrent?"is-current":""} ${cls}" data-evo-no="${p.no}"><span class="v31-evo-name">${p.name}</span><span class="v111-evo-body"><span class="v31-evo-image">${image}<span class="v31-evo-type">${window.PS_TYPE_ART?.(p.type)||iconForType(p.type)}</span></span>${conditions}</span></button>`;
 }
 function nestedEvolutionTree(root,currentNo){
   const leafCount=(p,seen=new Set())=>{
     if(!p||seen.has(p.no))return 0;
     const next=new Set(seen).add(p.no),edges=evolutionEntries(p).filter(e=>byNo(e.toNo));
     return edges.length?edges.reduce((n,e)=>n+leafCount(byNo(e.toNo),next),0):1;
   };
   let columns=1;const cells=[];
   const walk=(p,depth,row,incoming=null,seen=new Set())=>{
     if(!p||seen.has(p.no))return;
     const next=new Set(seen).add(p.no),span=Math.max(1,leafCount(p,seen));columns=Math.max(columns,depth+1);
     cells.push(`<div class="psg-evo-tree-cell" data-depth="${depth}" style="grid-column:${depth+1};grid-row:${row} / span ${span}">${evoNode(p,currentNo,'psg-evo-tree-node',incoming,true)}</div>`);
     let childRow=row;
     for(const edge of evolutionEntries(p)){
       const child=byNo(edge.toNo);if(!child||next.has(child.no))continue;
       walk(child,depth+1,childRow,edge,next);childRow+=Math.max(1,leafCount(child,next));
     }
   };
   walk(root,0,1);return `<div class="psg-evolution-tree" style="--evo-columns:${columns}">${cells.join('')}</div>`;
 }
 function renderEvolution(m){
   const el=document.getElementById("detailEvolution"),card=document.getElementById("evolutionCard");
   if(!el||!card)return;
   const root=rootOf(m),family=descendantsOf(root),rootBranches=evolutionEntries(root);
   if(family.length<=1){
     card.style.display=m.evolutionStatus==="未確認"?"":"none";
     el.textContent=m.evolutionStatus==="未確認"?"進化条件未確認":"";
     return;
   }
   card.style.display="";
   // Heavy branching: base at left-center, destinations in a 3-column grid on the right.
   if(rootBranches.length===1&&family.some(p=>evolutionEntries(p).length>1)){
     el.innerHTML=nestedEvolutionTree(root,m.no);
   }else if(rootBranches.length>1){
     const cells=rootBranches.map(e=>{const p=byNo(e.toNo);return `<div class="v31-branch-cell">${evoNode(p,m.no)}<div class="v31-evo-cond">${evolutionConditions(e).map(x=>`<span>${x}</span>`).join("")}</div></div>`}).join("");
     el.innerHTML=`<div class="v31-branch-layout"><div class="v31-branch-root">${evoNode(root,m.no,"is-root")}</div><div class="v31-big-arrow">›</div><div class="v31-branch-grid ${rootBranches.length===2?'is-two':''}">${cells}</div></div>`;
   }else{
     // Normal line: render the full known evolution family, not Pokédex-number adjacency.
     const chain=[];let cur=root,guard=0;
     while(cur&&guard++<12){chain.push(cur);const es=evolutionEntries(cur);if(es.length!==1)break;cur=byNo(es[0].toNo)}
     let html='<div class="v31-evo-line">';
     chain.forEach((p,i)=>{
       const edge=i<chain.length-1?evolutionEntries(p)[0]:null;
       html+=evoNode(p,m.no,"",edge);
       // The source card carries the arrow and outgoing requirement.
     });
     html+='</div>';el.innerHTML=html;
   }
   el.querySelectorAll("[data-evo-no]").forEach(btn=>btn.onclick=()=>{const no=Number(btn.dataset.evoNo);if(no&&no!==currentNo)openPokemonDetail(no,{pushHistory:true})});
 }
 function openPokemonDetail(no,opts={}){
   const m=byNo(no);if(!m)return;
   if(['skillPage','recipePage'].includes(window.PS?.state?.screen))detailOrigin=window.PS.state.screen;
   if(opts.pushHistory&&currentNo&&currentNo!==m.no){detailHistory.push(currentNo);detailForward.length=0}
   currentNo=m.no;setTheme(m.type);show("dexDetail");
   header(m);renderStats(m);renderFood(m);renderSkill(m);renderEvolution(m);renderSleepStyles(m);renderPokemonFields(m);switchTab(currentTab||"ability");
 }
 window.openPokemonDetail=openPokemonDetail;

 // v57: one explicit entry point for every Dex card.
 // renderDex calls this directly, so there is no capture/bubble race with the legacy handler.
 window.openDexCard=function(no){
   no=Number(no);if(!Number.isFinite(no))return;
   currentTab="ability";detailHistory.length=0;detailForward.length=0;detailOrigin="dex";currentNo=null;
   if(byNo(no)){openPokemonDetail(no);return;}
 };

 // Line-1 previous/next navigation also participates in the same reversible detail history.
 document.addEventListener("click",e=>{
   const b=e.target.closest?.("#v12Prev,#v12Next");
   if(!b||b.disabled)return;
   const current=byNo(currentNo);if(!current)return;
   const target=neighborOf(current.no,b.id==="v12Prev"?-1:1);
   if(!target)return;
   e.preventDefault();e.stopImmediatePropagation();openPokemonDetail(target.no,{pushHistory:true});
 },true);

 const back=document.querySelector("#dexDetail [data-back]");
 function leaveDetail(){
   show(detailOrigin||"dex");currentNo=null;
   detailHistory.length=0;detailForward.length=0;
   return true;
 }
 function backDetail(){
   const previous=detailHistory.pop();
   if(previous){detailForward.push(currentNo);openPokemonDetail(previous);return true}
   return leaveDetail();
 }
 function forwardDetail(){
   const next=detailForward.pop();
   if(!next)return false;
   if(currentNo)detailHistory.push(currentNo);
   openPokemonDetail(next);return true;
 }
 // The visible button exits to the originating list. Inner-screen swipes navigate detail history.
 if(back)back.addEventListener("click",e=>{e.preventDefault();e.stopImmediatePropagation();leaveDetail()},true);
 window.PS_DETAIL_NAV={back:backDetail,forward:forwardDetail};

 const toggle=document.getElementById("skillDetailToggle"),levels=document.getElementById("skillLevels");
 if(toggle&&levels)toggle.onclick=()=>{const o=levels.classList.toggle("open");toggle.textContent=o?"詳細を閉じる ▲":"詳細を見る ▼"};

 switchTab("ability");
})();
</script>
